name: pixagent

x-app: &app
  image: pixagent:local
  build: .
  env_file: .env.vps
  restart: unless-stopped
  init: true
  cpus: 0.75
  mem_limit: 4g
  environment:
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    NUMBA_NUM_THREADS: "1"
    U2NET_HOME: /root/.u2net
  volumes:
    - models:/root/.u2net
    - cache:/root/.cache
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    minio: {condition: service_healthy}

services:
  postgres:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 512m
    environment:
      POSTGRES_USER: pixagent
      POSTGRES_DB: pixagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pixagent -d pixagent"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    cpus: 0.1
    mem_limit: 256m
    command: [redis-server, --appendonly, "yes", --maxmemory, 192mb, --maxmemory-policy, noeviction]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    cpus: 0.15
    mem_limit: 512m
    command: server /data --console-address :9001
    ports: ["127.0.0.1:17313:9000"]
    environment:
      MINIO_ROOT_USER: pixagent
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?required}
    volumes: ["minio_data:/data"]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 7302
    ports: ["127.0.0.1:17302:7302"]
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; assert all(v == 'ok' for v in json.load(urllib.request.urlopen('http://127.0.0.1:7302/api/health', timeout=4)).values())"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    cpus: 0.75
    mem_limit: 2816m
    command: arq app.worker.WorkerSettings
    healthcheck:
      test: [CMD, arq, app.worker.WorkerSettings, --check]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  pg_data:
  redis_data:
  minio_data:
  models:
  cache:
